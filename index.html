function reveal(){const v=$('v');if(!v)return;const[r,c]=cur.sel,z=cur.z,s=S0*z,vw=v.clientWidth,vh=v.clientHeight-(cur.kb?KH:0),x=c*S0*z+cur.ox,y=r*S0*z+cur.oy,o=[cur.ox,cur.oy];
 if(x<4)cur.ox+=4-x;else if(x+s>vw-4)cur.ox-=x+s-vw+4;if(y<4)cur.oy+=4-y;else if(y+s>vh-4)cur.oy-=y+s-vh+4;
 if(o[0]!=cur.ox||o[1]!=cur.oy)cur.po=o}
function open(i,n){const pz=gen(CATS[i].w,n),q=S.p[i+'-'+n]||{},p=pz.P[0],vw=innerWidth;
 cur={id:i+'-'+n,pz,u:q.u||{},hint:q.hint||{},sel:xy(p.k[0]),dir:p.d,bad:{},kb:0,fs:{},z:1,ox:pz.C*S0<=vw?(vw-pz.C*S0)/2:8,oy:8};upd()}
function go(v,i,n,rep){V={v,i,n};if(v=='game')open(i,n);history[rep?'replaceState':'pushState'](V,'');render();scrollTo(0,0)}
onpopstate=e=>{const s=e.state||{v:'h'};if(V.v=='game'&&s.v=='game'&&!s.kb&&cur&&cur.kb&&s.i==V.i&&s.n==V.n){cur.kb=0;V=s;render();return}V=s;if(V.v=='game'&&(!cur||cur.id!=V.i+'-'+V.n))open(V.i,V.n);render()};
function openKb(){if(!cur.kb){cur.kb=1;history.pushState({...V,kb:1},'')}}
function closeKb(){if(cur.kb)history.back()}
function leave(){history.go(cur.kb?-2:-1)}
function fit(){document.querySelectorAll('#g .k').forEach(el=>{const i=el.dataset.i;if(cur.fs[i]){el.style.fontSize=cur.fs[i]+'px';return}let s=15;const sp2=el.firstChild;do{el.style.fontSize=s+'px';s-=.5}while(sp2.offsetHeight>el.clientHeight-6&&s>7);cur.fs[i]=s+.5})}
const gear=()=>V.v=='set'?history.back():go('set');
function tap(k){if(mvd)return;if(ks()==k&&wa(k,'h')&&wa(k,'v')||!wa(k,cur.dir))cur.dir=cur.dir=='h'?'v':'h';cur.sel=xy(k);openKb();reveal();render()}
function tapk(i){if(mvd)return;const p=cur.pz.P[i];cur.dir=p.d;cur.sel=xy(p.k[0]);openKb();reveal();render()}
function nx(w,i,s){for(i+=s;i>=0&&i<w.k.length;i+=s)if(!cur.lk[w.k[i]])return i;return -1}
function key(ch){const w=wa(ks(),cur.dir);let i=w.k.indexOf(ks());
 if(ch=='<'){if(cur.lk[w.k[i]]||!cur.u[w.k[i]]){i=nx(w,i,-1);if(i<0)return}delete cur.u[w.k[i]];delete cur.bad[w.k[i]];cur.sel=xy(w.k[i])}
 else{if(cur.lk[w.k[i]]){i=nx(w,i,1);if(i<0)return}cur.u[w.k[i]]=ch;delete cur.bad[w.k[i]];const j=nx(w,i,1);cur.sel=xy(w.k[j<0?i:j])}
 upd();if(cur.done)closeKb();reveal();render()}
function chk(){cur.bad={};for(const k in cur.u)if(cur.u[k]!=cur.pz.G[k].ch)cur.bad[k]=1;render()}
function hint(){const k=ks();if(cur.lk[k])return;cur.hint[k]=1;cur.u[k]=cur.pz.G[k].ch;delete cur.bad[k];upd();if(cur.done)closeKb();render()}
function mkSp(){const W=innerWidth,H=innerHeight,cx=W/2,cy=H*.48,off=[[-110,-90],[60,-125],[105,5],[-15,75],[-125,35]],rs=Math.random,L=[...'START'].sort(()=>rs()-.5),
 tl=L.map((l,i)=>({l,k:1,hx:cx+off[i][0]-23,hy:cy+off[i][1]-23,ph:rs()*6.3,fx:.7+rs()*.6,fy:.6+rs()*.6,x:cx,y:cy})),A='ABDEFGHIKLMNOPRUWZÄÖÜ';
 for(let i=0;i<11;i++){const an=rs()*6.28,v=14+rs()*22;tl.push({l:A[rs()*A.length|0],k:0,x:rs()*(W-46),y:rs()*(H-46),vx:Math.cos(an)*v,vy:Math.sin(an)*v})}
 return{W,H,tl,conn:[],drag:0}}
function spStart(){const st=$('st');sp.tl.forEach((a,i)=>a.el=st.querySelector(`[data-i="${i}"]`));sp.pl=$('pl');if(sp.done)st.classList.add('ok');if(!sp.run){sp.run=1;requestAnimationFrame(tick)}}
function hit(){const n=sp.conn.length;if(n>=5)return;for(const a of sp.tl)if(a.k&&!sp.conn.includes(a)&&a.l=='START'[n]&&Math.hypot(sp.px-a.x-23,sp.py-a.y-23)<30){sp.conn.push(a);a.el.classList.add('c1');if(sp.conn.length==5)win();break}}
function win(){sp.done=1;sp.drag=0;sp.conn.forEach((a,i)=>{a.tx=sp.W/2-123+i*50;a.ty=sp.H*.42});$('st').classList.add('ok')}
function tick(t){if(V.v!='splash'){sp.run=0;return}requestAnimationFrame(tick);const dt=Math.min(.05,(t-(sp.t0||t))/1e3),W=sp.W,H=sp.H,T=46,s=t/1e3;sp.t0=t;
 for(const a of sp.tl){if(a.k){if(sp.done){const q=Math.min(1,dt*7);a.x+=(a.tx-a.x)*q;a.y+=(a.ty-a.y)*q}else{a.x=a.hx+Math.sin(s*a.fx+a.ph)*14;a.y=a.hy+Math.cos(s*a.fy+a.ph)*14}}
  else{a.x+=a.vx*dt;a.y+=a.vy*dt;if(a.x<0){a.x=0;a.vx=Math.abs(a.vx)}if(a.x>W-T){a.x=W-T;a.vx=-Math.abs(a.vx)}if(a.y<0){a.y=0;a.vy=Math.abs(a.vy)}if(a.y>H-T){a.y=H-T;a.vy=-Math.abs(a.vy)}}
  if(a.el)a.el.style.transform=`translate(${a.x}px,${a.y}px)`}
 if(sp.drag&&!sp.done)hit();
 const pts=sp.conn.map(a=>`${a.x+23},${a.y+23}`);if(sp.drag&&!sp.done)pts.push(`${sp.px},${sp.py}`);if(sp.pl)sp.pl.setAttribute('points',pts.join(' '))}
function knob(){const k=$('knob');if(k){const a=S.h*Math.PI/180;k.style.transform=`translate(${98*Math.sin(a)}px,${-98*Math.cos(a)}px)`}}
function hue(e){const r=$('ring').getBoundingClientRect(),a=Math.atan2(e.clientX-r.left-r.width/2,-(e.clientY-r.top-r.height/2))*180/Math.PI;S.h=Math.round((a+360)%360);sv();theme();knob()}
const pt=new Map();let G0=null,rd=0;
function base(){const a=[...pt.values()];if(a.length==1)G0={m:1,x:a[0].x,y:a[0].y,ox:cur.ox,oy:cur.oy};else if(a.length>1){const[p,q]=a;G0={m:2,d:Math.hypot(p.x-q.x,p.y-q.y)||1,cx:(p.x+q.x)/2,cy:(p.y+q.y)/2,ox:cur.ox,oy:cur.oy,z:cur.z}}else G0=null}
document.addEventListener('pointerdown',e=>{
 if(V.v=='splash'){if(e.target.closest('#st')&&!e.target.closest('button')&&!sp.done){sp.drag=1;sp.conn=[];sp.tl.forEach(a=>a.el&&a.el.classList.remove('c1'));sp.px=e.clientX;sp.py=e.clientY;hit()}return}
 const rg=e.target.closest('#ring');if(rg){if(!e.target.closest('#fb')){const r=rg.getBoundingClientRect();if(Math.hypot(e.clientX-r.left-r.width/2,e.clientY-r.top-r.height/2)>64){rd=1;hue(e)}}return}
 if(V.v=='game'&&e.target.closest('#v')){pt.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pt.size==1){mvd=0;$('g').style.transition='none'}else mvd=1;base()}});
document.addEventListener('pointermove',e=>{
 if(V.v=='splash'){if(sp.drag){sp.px=e.clientX;sp.py=e.clientY;hit()}return}
 if(rd){hue(e);return}
 if(!pt.has(e.pointerId)||!G0)return;pt.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...pt.values()];
 if(G0.m==1){const dx=a[0].x-G0.x,dy=a[0].y-G0.y;if(!mvd&&Math.hypot(dx,dy)<8)return;mvd=1;cur.ox=G0.ox+dx;cur.oy=G0.oy+dy}
 else{const[p,q]=a,d=Math.hypot(p.x-q.x,p.y-q.y)||1,cx=(p.x+q.x)/2,cy=(p.y+q.y)/2,R=$('v').getBoundingClientRect(),z=cl(G0.z*d/G0.d,[.2,3]),f=z/G0.z;mvd=1;cur.z=z;cur.ox=cx-R.left-(G0.cx-R.left-G0.ox)*f;cur.oy=cy-R.top-(G0.cy-R.top-G0.oy)*f}
 pos()});
const up=e=>{
 if(V.v=='splash'){if(sp.drag){sp.drag=0;if(!sp.done){sp.conn=[];sp.tl.forEach(a=>a.el&&a.el.classList.remove('c1'))}}return}
 rd=0;if(!pt.has(e.pointerId))return;pt.delete(e.pointerId);
 if(pt.size){mvd=1;base();return}
 G0=null;if(mvd){snap();setTimeout(()=>mvd=0,80)}else if(e.type=='pointerup'&&!e.target.closest('.c')&&cur.kb){closeKb()}};
document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
function render(){const g=V.v=='game';document.body.className=$('a').className=g?'g':'';let h='';
 if(V.v=='splash')h=`<div id=st><svg id=ln><polyline id=pl /></svg>${sp.tl.map((a,i)=>`<div class="fl ${a.k?'kt':'dt'}" data-i=${i}>${a.l}</div>`).join('')}<div class=sh><h1>Maschinenbau<br>Kreuzworträtsel</h1><p>Verbinde S – T – A – R – T<br>mit einer durchgehenden Wischgeste</p></div><div class=sb><button class="b p go" onclick="go('h',0,0,1)">Los geht’s</button><button class="b sk" onclick="go('h',0,0,1)">Überspringen</button></div></div>`
 else if(V.v=='h')h=`<div class=hd><h1>Maschinenbau KWR</h1></div><div class=pad>${CATS.map((c,i)=>`<button class=cd onclick="go('cat',${i})"><b>${c.n}</b><div class=bar><i style="width:${cnt(i)*10}%"></i></div><small>${cnt(i)} von 10 gelöst</small></button>`).join('')}</div>`;
 else if(V.v=='set'){const d=S.dk;h=`<div class=hd><button class=b onclick="history.back()">‹</button><h1>Einstellungen</h1></div><div class=pad><button class=md style="${d?'background:#fff;color:#3a3a3a':'background:#3a3a3a;color:#fff'}" onclick="S.dk=!S.dk;sv();theme();render()">${d?SUN:MOON}<span>${d?'Lightmode':'Darkmode'}</span></button><div class=cd style="text-align:center"><b>Akzentfarbe</b><div id=ring><div id=ctr></div><div id=knob></div><button id=fb onclick="history.back()">Fertig</button></div></div></div>`}
 else if(V.v=='cat')h=`<div class=hd><button class=b onclick="history.back()">‹</button><h1>${CATS[V.i].n}</h1></div><div class=pad><div class=tl>${Array.from({length:10},(_,n)=>`<button class="tb${fr(V.i,n+1)==1?' dn':''}" style="--f:${fr(V.i,n+1)*100}" onclick="go('game',${V.i},${n+1})"><span>${n+1}</span></button>`).join('')}</div></div>`;
 else{const z=cur.pz,aw=wa(ks(),cur.dir),st={};z.P.forEach(p=>(st[p.k[0]]=st[p.k[0]]||[]).push(p.d));let c2='';
  for(let r=0;r<z.R;r++)for(let c=0;c<z.C;c++){const k=r+','+c,q=z.CK[k];
   if(q){const i=z.P.indexOf(q);c2+=`<div class="c k ${q.d}" data-i="${i}" style="font-size:${cur.fs[i]||15}px" onclick="tapk(${i})"><span>${q.q}</span></div>`}
   else if(z.G[k])c2+=`<div class="c${cur.hint[k]?' t':''}${cur.bad[k]?' x':''}${cur.cw[k]?' f':''}${k==ks()?' s':aw.k.includes(k)?' w':''}" onclick="tap('${k}')">${(st[k]||[]).map(d=>`<b class="${d}"></b>`).join('')}${cur.u[k]||''}</div>`;
   else c2+='<div class="c e"></div>'}
  h=`<div class=hd><button class=b onclick="leave()">‹</button><h1>Rätsel ${V.n}</h1><button class=b onclick=chk()>Prüfen</button><button class=b onclick=hint()>Tipp</button></div><div id=v><div id=g style="grid-template-columns:repeat(${z.C},66px);transform:translate(${cur.ox}px,${cur.oy}px) scale(${cur.z})">${c2}</div></div>${cur.done?`<div class=dc><b>Gelöst! ✓</b><button class="b p" onclick="leave()">Weiter</button></div>`:cur.kb?`<div class=kb>${KB.map((r,i)=>`<div class=r>${i==2?'<button style="flex:1.5" onclick="closeKb()">⌄</button>':''}${[...r].map(l=>`<button onclick="key('${l}')">${l}</button>`).join('')}${i==2?'<button style="flex:1.5" onclick="key(\'<\')">⌫</button>':''}</div>`).join('')}</div>`:''}`}
 $('a').innerHTML=h;knob();if(V.v=='splash')spStart();if(g){fit();if(cur.po){const e=$('g'),p=cur.po;cur.po=0;e.style.transform=`translate(${p[0]}px,${p[1]}px) scale(${cur.z})`;e.offsetWidth;e.style.transition='transform .22s ease-out';pos()}}}
theme();history.replaceState(V,'');sp=mkSp();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
