function stap(i){const x=sp.t[i];if(x.u||sp.g>=sp.w.length)return;if(x.c==sp.w[sp.g]){x.u=1;sp.g++;sp.b=-1}else sp.b=i;render()}
function knob(){const k=$('knob');if(k){const a=S.h*Math.PI/180;k.style.transform=`translate(${98*Math.sin(a)}px,${-98*Math.cos(a)}px)`}}
function hue(e){const r=$('ring').getBoundingClientRect(),a=Math.atan2(e.clientX-r.left-r.width/2,-(e.clientY-r.top-r.height/2))*180/Math.PI;S.h=Math.round((a+360)%360);sv();theme();knob()}
let P0=null,rd=0;
document.addEventListener('pointerdown',e=>{if(e.target.closest('#ring')){rd=1;hue(e);return}if(V.v=='game'&&e.target.closest('#v')){P0={x:e.clientX,y:e.clientY,ox:cur.ox,oy:cur.oy};mvd=0;$('g').style.transition='none'}});
document.addEventListener('pointermove',e=>{if(rd){hue(e);return}if(!P0)return;const dx=e.clientX-P0.x,dy=e.clientY-P0.y;if(!mvd&&Math.hypot(dx,dy)<8)return;mvd=1;cur.ox=P0.ox+dx;cur.oy=P0.oy+dy;pos()});
const up=e=>{rd=0;if(!P0)return;P0=null;if(mvd){snap();setTimeout(()=>mvd=0,80)}else if(e.type=='pointerup'&&!e.target.closest('.c')&&cur.kb){cur.kb=0;render()}};
document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
function render(){const g=V.v=='game';document.body.className=$('a').className=g?'g':'';let h='';
 if(V.v=='splash'){const done=sp.g==sp.w.length;h=`<div class=pad style="text-align:center;padding-top:calc(9vh + env(safe-area-inset-top))"><h1 style="font-size:28px;white-space:normal;line-height:1.2">Maschinenbau<br>Kreuzworträtsel</h1><p style="opacity:.75;margin:18px 8px 0">Ordne die Buchstaben zu dem gesuchten Begriff:<br><b>${sp.q}</b></p><div class=sl>${[...sp.w].map((c,i)=>`<i>${i<sp.g?c:''}</i>`).join('')}</div><div class=sl>${sp.t.map((x,i)=>`<button class="lt${x.u?' u':''}${sp.b==i?' bd':''}" onclick="stap(${i})">${x.c}</button>`).join('')}</div><p style="min-height:1.5em;margin:10px"><b>${done?'Richtig! 🎉':''}</b></p><button class="b${done?' p':''}" style="padding:12px 28px;font-size:17px" onclick="go('h',0,0,1)">${done?'Los geht’s':'Überspringen'}</button> <button class=b style="padding:12px 16px;font-size:17px" onclick="sp=ns();render()">Neues Wort</button></div>`}
 else if(V.v=='h')h=`<div class=hd><h1>Maschinenbau KWR</h1></div><div class=pad>${CATS.map((c,i)=>`<button class=cd onclick="go('cat',${i})"><b>${c.n}</b><div class=bar><i style="width:${cnt(i)*10}%"></i></div><small>${cnt(i)} von 10 gelöst</small></button>`).join('')}</div>`;
 else if(V.v=='set')h=`<div class=hd><button class=b onclick="history.back()">‹</button><h1>Einstellungen</h1></div><div class=pad><button class=cd onclick="S.dk=!S.dk;sv();theme();render()"><b>Darkmode</b> – ${S.dk?'an':'aus'}</button><div class=cd style="text-align:center"><b>Akzentfarbe</b><div id=ring><div id=ctr></div><div id=knob></div></div></div></div>`;
 else if(V.v=='cat')h=`<div class=hd><button class=b onclick="history.back()">‹</button><h1>${CATS[V.i].n}</h1></div><div class=pad><div class=tl>${Array.from({length:10},(_,n)=>`<button class=tb style="--f:${fr(V.i,n+1)*100}" onclick="go('game',${V.i},${n+1})"><span>${n+1}${fr(V.i,n+1)==1?' ✓':''}</span></button>`).join('')}</div></div>`;
 else{const z=cur.pz,aw=wa(ks(),cur.dir);let c2='';
  for(let r=0;r<z.R;r++)for(let c=0;c<z.C;c++){const k=r+','+c,q=z.CK[k];
   if(q){const n=q.q.length;c2+=`<div class="c k ${q.d}" style="font-size:${n>40?8:n>30?9:10}px" onclick="tapk(${z.P.indexOf(q)})"><span>${q.q}</span><b>${q.d=='h'?'▶':'▼'}</b></div>`}
   else if(z.G[k])c2+=`<div class="c${cur.hint[k]?' t':''}${cur.bad[k]?' x':''}${cur.cw[k]?' f':''}${k==ks()?' s':aw.k.includes(k)?' w':''}" onclick="tap('${k}')">${cur.u[k]||''}</div>`;
   else c2+='<div class="c e"></div>'}
  h=`<div class=hd><button class=b onclick="history.back()">‹</button><h1>Rätsel ${V.n}</h1><button class=b onclick=chk()>Prüfen</button><button class=b onclick=hint()>Tipp</button></div><div id=v><div id=g style="grid-template-columns:repeat(${z.C},68px);transform:translate(${cur.ox}px,${cur.oy}px)">${c2}</div></div>${cur.done?`<div class=dc><b>Gelöst! ✓</b><button class="b p" onclick="history.back()">Weiter</button></div>`:cur.kb?`<div class=kb>${KB.map((r,i)=>`<div class=r>${i==2?'<button style="flex:1.5" onclick="cur.kb=0;render()">⌄</button>':''}${[...r].map(l=>`<button onclick="key('${l}')">${l}</button>`).join('')}${i==2?'<button style="flex:1.5" onclick="key(\'<\')">⌫</button>':''}</div>`).join('')}</div>`:''}`}
 $('a').innerHTML=h;knob()}
theme();history.replaceState(V,'');sp=ns();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
